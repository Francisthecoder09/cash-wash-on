spring:
  application:
    name: car-wash-operations
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:carwashdb;DB_CLOSE_DELAY=-1;MODE=MySQL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      initialization-fail-timeout: -1  # Don't fail on startup if metadata check times out
      max-lifetime: 120000              # 2 min — shorter than TiDB's idle timeout
      keepalive-time: 60000            # ping every 60s to keep connections alive
      connection-timeout: 30000        # 30s to acquire a connection from pool
      connection-test-query: SELECT 1
  jpa:
    # database-platform auto-detected from MySQL driver — no need to specify
    hibernate:
      ddl-auto: none
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: ${SPRING_SQL_INIT_MODE:always}
      schema-locations: ${SPRING_SQL_INIT_SCHEMA_LOCATIONS:classpath:sql/schema.sql}
      data-locations: ${SPRING_SQL_INIT_DATA_LOCATIONS:classpath:sql/seed.sql}
  h2:
    console:
      enabled: false
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}

server:
  port: ${PORT:${SERVER_PORT:8083}}

app:
  jwt:
    # IMPORTANT: Set APP_JWT_SECRET environment variable in production!
    # Generate a 256-bit (32-byte) random key for production.
    # Example: openssl rand -base64 32
    secret: ${APP_JWT_SECRET:dev-secret-key-for-local-testing-only-32bytes}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:720}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:4173,http://127.0.0.1:3000}
  mail:
    mock-enabled: ${APP_MAIL_MOCK_ENABLED:true}
    from: ${APP_MAIL_FROM:noreply@carwash.com}

management:
  health:
    mail:
      enabled: ${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    org.springframework: ${LOG_LEVEL_SPRING:INFO}
    org.hibernate: ${LOG_LEVEL_HIBERNATE:INFO}
    com.carwash.ops: ${LOG_LEVEL_APP:INFO}
