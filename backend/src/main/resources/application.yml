spring:
  application:
    name: car-wash-operations
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:carwashdb;DB_CLOSE_DELAY=-1;MODE=MySQL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      initialization-fail-timeout: -1  # Don't fail on startup if metadata check times out
      max-lifetime: 120000              # 2 min — shorter than TiDB's idle timeout
      keepalive-time: 60000            # ping every 60s to keep connections alive
      connection-timeout: 30000        # 30s to acquire a connection from pool
      connection-test-query: SELECT 1
  jpa:
    # database-platform auto-detected from MySQL driver — no need to specify
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
      schema-locations: classpath:sql/schema.sql
      data-locations: classpath:sql/seed.sql
  h2:
    console:
      enabled: false

server:
  port: 8083

app:
  jwt:
    # IMPORTANT: Set APP_JWT_SECRET environment variable in production!
    # Generate a 256-bit (32-byte) random key for production.
    # Example: openssl rand -base64 32
    secret: ${APP_JWT_SECRET:dev-secret-key-for-local-testing-only-32bytes}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:720}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate: INFO
    com.carwash.ops: DEBUG
