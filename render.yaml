services:
  - type: web
    name: car-wash-on-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: com.mysql.cj.jdbc.Driver
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_SQL_INIT_MODE
        value: always
      - key: SPRING_SQL_INIT_SCHEMA_LOCATIONS
        value: classpath:sql/schema-tidb.sql
      - key: SPRING_SQL_INIT_DATA_LOCATIONS
        value: classpath:sql/seed-tidb.sql
      - key: APP_JWT_SECRET
        sync: false
      - key: APP_JWT_EXPIRATION_MINUTES
        value: "720"
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_MAIL_MOCK_ENABLED
        value: "false"
      - key: APP_MAIL_FROM
        sync: false
      - key: SPRING_MAIL_HOST
        value: smtp.sendgrid.net
      - key: SPRING_MAIL_PORT
        value: "587"
      - key: SPRING_MAIL_USERNAME
        value: apikey
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: SPRING_MAIL_SMTP_AUTH
        value: "true"
      - key: SPRING_MAIL_SMTP_STARTTLS_ENABLE
        value: "true"
      - key: LOG_LEVEL_ROOT
        value: INFO
      - key: LOG_LEVEL_SPRING
        value: INFO
      - key: LOG_LEVEL_HIBERNATE
        value: INFO
      - key: LOG_LEVEL_APP
        value: INFO
